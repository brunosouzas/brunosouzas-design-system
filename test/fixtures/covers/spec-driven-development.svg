<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="sdd-title sdd-desc" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="sdd-title">A one-line request becomes a reviewed spec before any code</title>
  <desc id="sdd-desc">Illustration. On the left, a small slip with a single line, labelled request. In the middle, a tall spec sheet, labelled spec: every row starts with a yellow question mark and ends with a green tick, the open questions written down and answered, and a green GO stamp sits on its corner. On the right, a dark code block, labelled code, that the arrow only reaches after the stamp.</desc>
