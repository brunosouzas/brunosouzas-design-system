<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 560 322" role="img" aria-labelledby="circuit-breaker-states-pt-title circuit-breaker-states-pt-desc" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="circuit-breaker-states-pt-title">Estados do circuit breaker</title>
  <desc id="circuit-breaker-states-pt-desc">Diagrama de estados. O circuito começa em CLOSED. CLOSED vai para OPEN quando a taxa de falha na janela passa do limite, com um mínimo de chamadas. OPEN vai para HALF_OPEN quando o tempo de espera (resetTimeout) expira. HALF_OPEN volta para CLOSED quando há chamadas de teste com sucesso suficiente, e volta para OPEN com qualquer falha durante o teste.</desc>
  <style>@font-face{font-family:'Source Code Pro';font-weight:550 900;font-style:normal;src:url(data:font/ttf;base64,) format('truetype')}
@font-face{font-family:'Source Sans 3';font-weight:550 799;font-style:normal;src:url(data:font/ttf;base64,) format('truetype')}</style>
