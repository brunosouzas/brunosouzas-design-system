  <title id="home-banner-title">Integration, delivery and AI between systems</title>
  <desc id="home-banner-desc">Illustration on a peach background with soft rings. On the left, a white browser window labelled APIs and a stack of three white server units send orange pipes into a cream Mule flow labelled Integration, with a Choice and a For Each component. From the flow an orange pipe runs right through two green passing checks labelled CI/CD, on a yellow tag, into a white cloud. A white robot with amber eyes stands above the pipe on the right.</desc>
