    <rect x="42" y="16.5" width="6" height="6" fill="#FFFFFF" stroke="#0A1033" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="42" y="25" width="6" height="6" fill="#FFFFFF" stroke="#0A1033" stroke-width="1.5" stroke-linejoin="round"/>
