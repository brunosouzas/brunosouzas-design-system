<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40" viewBox="0 0 64 40" role="img" aria-labelledby="eip-splitter-title eip-splitter-desc" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="eip-splitter-title">Splitter</title>
