name: Release

# Publishes one version of @brunosouzas/design-system to npm, with provenance, and creates its GitHub
# release. How to release, the first-version bootstrap and the checks: docs/release.md. Same
# procedure as stackledger's release workflow.
#
# Two jobs, so the publishing identity never exists while dependencies install or their scripts run:
# - check: no publishing rights. Tag check (shape, version, on origin/main), npm ci, type-check,
#   token freshness, build, tests (including the installed-package test), audit of what ships, and
#   npm pack of the built files; hands the tarball and its integrity on as an artifact.
# - publish: in the environment npm, which needs the owner's approval. It installs and builds
#   nothing; it runs scripts/release-publish.sh from the tagged commit on the downloaded files.
#   A re-run finishes a partial release without publishing twice.
#
# Actions are pinned by commit SHA, with the tag in a comment. No npm cache anywhere.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tag check can see whether the commit is on origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run tokens:check
      - run: npm run build
      - run: npm test
      - name: Audit what ships (the package has no runtime dependency; any finding fails)
        run: npm audit --omit=dev --audit-level=low
      - name: Pack the built files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/pack.json"
          node -e '
            const [packed] = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            require("node:fs").writeFileSync(process.argv[2], packed.integrity + "\n");
            console.log(packed.filename, packed.integrity);
          ' "$RUNNER_TEMP/pack.json" "$RUNNER_TEMP/release/integrity"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      # Only to run scripts/release-publish.sh from the reviewed, tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Data only: nothing from the artifact is executed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Publish and create the release
        env:
          # Empty after the first version: npm then publishes through OIDC (trusted publishing).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # No comment may sit on a continued line: bash ends the command there (test/package/release.test.ts).
        # brunosouzas-design-system-<version>.tgz is the npm pack name of @brunosouzas/design-system.
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/release-publish.sh "$RUNNER_TEMP/release/brunosouzas-design-system-$version.tgz" \
            "$RUNNER_TEMP/release/integrity"
